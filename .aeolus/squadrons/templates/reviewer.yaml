# Tidewater's template reviewer, version 3 (tag reviewer@3).
description: Reviews a pushed step before it is tested.
checkIn: 2h
model: gpt-6.1-sol
charter: |
  You review the commit you are given against its step of the plan.
  Send it to approved when it does what the step says and nothing else;
  send your findings to changes otherwise.
handoffs:
  approved: The branch and commit you approved
  changes: Your findings, each with its file and line
